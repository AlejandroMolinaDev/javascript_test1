<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>

    <h1>Demostración de Output en Javascript</h1>

    <button id="btnAlerta">Mostrar nombre</button>

    <p id="parrafo"></p>
    <button id="btnTexto">Actualizar texto</button>

    <script>
        console.log('La página se ha cargado correctamente.');

        document.getElementById('btnAlerta').addEventListener('click', () => {
            alert('Jesús Alejandro Molina Elías');
        });

        document.getElementById('btnTexto').addEventListener('click', () => {
            document.getElementById('parrafo').textContent = '¡Texto actualizado con Javascript!';
        });
    </script>

</body>
</html>
